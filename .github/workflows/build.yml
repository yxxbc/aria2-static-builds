name: Build aria2

on:
  workflow_dispatch:
    inputs:
      aria2_version:
        description: "aria2 version to build (e.g. 1.37.0)"
        required: true
        type: string
        default: "1.37.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: aria2-${{ github.workflow }}-${{ github.ref }}-${{ inputs.aria2_version || github.ref_name }}
  cancel-in-progress: true

env:
  ARIA2_VERSION: ${{ inputs.aria2_version || (startsWith(github.ref, 'refs/tags/v') && format('{0}', substr(github.ref_name, 1)) || '1.37.0') }}

jobs:
  build:
    name: aria2-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
            platform: windows
            msystem: UCRT64
            resource_name: aria2c.exe
            artifact_name: aria2-windows-x86_64
          - label: windows-aarch64
            os: windows-11-arm
            platform: windows
            msystem: CLANGARM64
            resource_name: aria2c.exe
            artifact_name: aria2-windows-aarch64
          - label: macos-x86_64
            os: macos-15-intel
            platform: macos
            resource_name: aria2c
            artifact_name: aria2-macos-x86_64
          - label: macos-aarch64
            os: macos-14
            platform: macos
            resource_name: aria2c
            artifact_name: aria2-macos-aarch64
          - label: linux-x86_64
            os: ubuntu-24.04
            platform: linux
            resource_name: aria2c
            artifact_name: aria2-linux-x86_64
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            platform: linux
            resource_name: aria2c
            artifact_name: aria2-linux-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            autopoint \
            build-essential \
            ca-certificates \
            gettext \
            git \
            libexpat1-dev \
            libsqlite3-dev \
            libssl-dev \
            libtool \
            pkg-config \
            zlib1g-dev

      - name: Build static c-ares from source (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -euxo pipefail
          CARES_VERSION="1.30.0"
          curl -LO "https://github.com/c-ares/c-ares/releases/download/v${CARES_VERSION}/c-ares-${CARES_VERSION}.tar.gz"
          tar -zxf "c-ares-${CARES_VERSION}.tar.gz"
          cd "c-ares-${CARES_VERSION}"
          ./configure --enable-static --disable-shared --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          cd ..
          rm -rf "c-ares-${CARES_VERSION}" "c-ares-${CARES_VERSION}.tar.gz"

      - name: Install macOS build dependencies
        if: matrix.platform == 'macos'
        run: |
          brew install autoconf automake c-ares expat gettext libtool pkg-config sqlite zlib
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix libtool)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup MSYS2
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          cache: true
          install: >-
            base-devel
            git
            autoconf
            automake
            libtool
            gettext-devel
            pkgconf
            zip
          pacboy: >-
            toolchain:p
            c-ares:p
            expat:p
            sqlite3:p
            zlib:p

      - name: Build and verify aria2 (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --branch "release-${ARIA2_VERSION}" \
            --depth 1 \
            https://github.com/aria2/aria2.git \
            build/aria2-src

          cd build/aria2-src
          git rev-parse --verify HEAD
          autoreconf -i

          configure_args=(
            --without-libssh2
            --without-libxml2
          )

          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            export CPPFLAGS="-I/usr/local/include"
            export LDFLAGS="-L/usr/local/lib"
            configure_args+=(
              ARIA2_STATIC=yes
              --with-openssl
              --without-gnutls
              --without-libnettle
              --without-libgcrypt
              --disable-nls
              LIBS="-ldl"
            )
          elif [[ "${{ matrix.platform }}" == "macos" ]]; then
            export CPPFLAGS="-I$(brew --prefix c-ares)/include -I$(brew --prefix expat)/include -I$(brew --prefix sqlite)/include -I$(brew --prefix zlib)/include"
            export LDFLAGS="-L$(brew --prefix c-ares)/lib -L$(brew --prefix expat)/lib -L$(brew --prefix sqlite)/lib -L$(brew --prefix zlib)/lib"
            export PKG_CONFIG_PATH="$(brew --prefix c-ares)/lib/pkgconfig:$(brew --prefix expat)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            configure_args+=(
              --with-appletls
              --without-openssl
              --without-gnutls
              --without-libnettle
              --without-libgcrypt
              --disable-nls
            )
          fi

          ./configure "${configure_args[@]}"

          jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)"
          make -j"${jobs}"

          # Strip debug symbols to reduce binary size from ~100MB to ~4MB
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            strip -s src/aria2c
          elif [[ "${{ matrix.platform }}" == "macos" ]]; then
            strip src/aria2c
          fi

          artifact_dir="${GITHUB_WORKSPACE}/artifacts/${{ matrix.label }}"
          mkdir -p "${artifact_dir}"
          cp "src/aria2c" "${artifact_dir}/${{ matrix.resource_name }}"
          chmod 755 "${artifact_dir}/${{ matrix.resource_name }}"

          version_output="$("${artifact_dir}/${{ matrix.resource_name }}" --version)"
          printf '%s\n' "${version_output}"
          grep -F "aria2 version ${ARIA2_VERSION}" <<< "${version_output}"
          grep -F "Enabled Features" <<< "${version_output}"
          grep -F "HTTPS" <<< "${version_output}"

          cd "${artifact_dir}"
          ls -lh "${{ matrix.resource_name }}"

      - name: Build and verify aria2 (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          set -euxo pipefail

          git clone \
            --branch "release-${ARIA2_VERSION}" \
            --depth 1 \
            https://github.com/aria2/aria2.git \
            build/aria2-src

          cd build/aria2-src
          sed -i 's/const char\* gai_strerror(ecode)/const char* gai_strerror(int ecode)/g' src/gai_strerror.c
          sed -i '/int ecode;/d' src/gai_strerror.c
          git rev-parse --verify HEAD
          autoreconf -i

          configure_args=(
            --without-libssh2
            --without-libxml2
            ARIA2_STATIC=yes
            --without-openssl
            --without-gnutls
            --without-libnettle
            --without-libgcrypt
            --disable-nls
            ac_cv_func_getaddrinfo=yes
            ac_cv_func_gai_strerror=yes
          )

          ./configure "${configure_args[@]}"

          jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)"
          make -j"${jobs}"

          # Strip debug symbols to reduce binary size from 181MB to ~5MB
          strip -s src/aria2c.exe

          artifact_dir="${GITHUB_WORKSPACE}/artifacts/${{ matrix.label }}"
          mkdir -p "${artifact_dir}"
          cp "src/aria2c.exe" "${artifact_dir}/${{ matrix.resource_name }}"
          chmod 755 "${artifact_dir}/${{ matrix.resource_name }}"

          version_output="$("${artifact_dir}/${{ matrix.resource_name }}" --version)"
          printf '%s\n' "${version_output}"
          grep -F "aria2 version ${ARIA2_VERSION}" <<< "${version_output}"
          grep -F "Enabled Features" <<< "${version_output}"
          grep -F "HTTPS" <<< "${version_output}"

          cd "${artifact_dir}"
          ls -lh "${{ matrix.resource_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.label }}
          if-no-files-found: error
          retention-days: 3

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package and organize release assets
        run: |
          set -euxo pipefail
          mkdir -p release-assets

          # Windows x64
          cp artifacts/aria2-windows-x86_64/aria2c.exe release-assets/aria2c-${{ env.ARIA2_VERSION }}-windows-x64.exe
          (cd artifacts/aria2-windows-x86_64 && zip -9 "${GITHUB_WORKSPACE}/release-assets/aria2c-${{ env.ARIA2_VERSION }}-windows-x64.zip" aria2c.exe)

          # Windows ARM64
          cp artifacts/aria2-windows-aarch64/aria2c.exe release-assets/aria2c-${{ env.ARIA2_VERSION }}-windows-arm64.exe
          (cd artifacts/aria2-windows-aarch64 && zip -9 "${GITHUB_WORKSPACE}/release-assets/aria2c-${{ env.ARIA2_VERSION }}-windows-arm64.zip" aria2c.exe)

          # macOS x64 (Intel)
          cp artifacts/aria2-macos-x86_64/aria2c release-assets/aria2c-${{ env.ARIA2_VERSION }}-macos-x64
          chmod +x release-assets/aria2c-${{ env.ARIA2_VERSION }}-macos-x64
          tar -czf release-assets/aria2c-${{ env.ARIA2_VERSION }}-macos-x64.tar.gz -C artifacts/aria2-macos-x86_64 aria2c

          # macOS ARM64 (Apple Silicon)
          cp artifacts/aria2-macos-aarch64/aria2c release-assets/aria2c-${{ env.ARIA2_VERSION }}-macos-arm64
          chmod +x release-assets/aria2c-${{ env.ARIA2_VERSION }}-macos-arm64
          tar -czf release-assets/aria2c-${{ env.ARIA2_VERSION }}-macos-arm64.tar.gz -C artifacts/aria2-macos-aarch64 aria2c

          # Linux x64
          cp artifacts/aria2-linux-x86_64/aria2c release-assets/aria2c-${{ env.ARIA2_VERSION }}-linux-x64
          chmod +x release-assets/aria2c-${{ env.ARIA2_VERSION }}-linux-x64
          tar -czf release-assets/aria2c-${{ env.ARIA2_VERSION }}-linux-x64.tar.gz -C artifacts/aria2-linux-x86_64 aria2c

          # Linux ARM64
          cp artifacts/aria2-linux-aarch64/aria2c release-assets/aria2c-${{ env.ARIA2_VERSION }}-linux-arm64
          chmod +x release-assets/aria2c-${{ env.ARIA2_VERSION }}-linux-arm64
          tar -czf release-assets/aria2c-${{ env.ARIA2_VERSION }}-linux-arm64.tar.gz -C artifacts/aria2-linux-aarch64 aria2c

          # Generate SHA256SUMS.txt
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Create or update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ env.ARIA2_VERSION }}"
          notes="### aria2 v${{ env.ARIA2_VERSION }} Static Builds

          Automated static builds of aria2 v${{ env.ARIA2_VERSION }} for Windows, macOS, and Linux.
          Optimized with stripped debug symbols (binary sizes ~4-5MB).

          #### Checksums (SHA-256)
          \`\`\`text
          $(cat release-assets/SHA256SUMS.txt)
          \`\`\`
          "

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Updating assets..."
            gh release upload "$tag" release-assets/* --clobber
          else
            echo "Creating new release $tag..."
            gh release create "$tag" \
              --title "aria2 v${{ env.ARIA2_VERSION }}" \
              --notes "$notes" \
              release-assets/*
          fi
